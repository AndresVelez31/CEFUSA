<form id="formEditPayment" method="POST" action="{% url 'payment:update_payment' payment.id %}">
  {% csrf_token %}
  <div class="modal-header bg-primary text-white">
  <h5 class="modal-title">Edit Payment</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <div id="success-message" style="display:none;" class="alert alert-success">
      Payment updated successfully!
    </div>
    {{ form.as_p }}
  </div>
  <div class="modal-footer">
  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
  <button type="button" class="btn btn-danger" id="deletePaymentBtn" data-id="{{ payment.id }}">Delete</button>
  <button type="submit" class="btn btn-primary" id="saveChangesBtn">Save Changes</button>
  </div>
</form>

{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}

{% block content %}

<div class="container py-4">
  <div class="card shadow">
    <div class="card-header bg-primary text-white text-center">
      <h2 class="mb-0"> Dashboard de Administrador</h2>
    </div>
    <div class="card-body">
      <div class="accordion" id="dashboardAccordion">

        <!-- Player statistics section -->
        <div class="accordion-item">

          <h2 class="accordion-header" id="headingPlayers">
            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapsePlayers" aria-expanded="true" aria-controls="collapsePlayers">
              Estadísticas de jugadores
            </button>
          </h2>

          <div id="collapsePlayers" class="accordion-collapse collapse show" aria-labelledby="headingPlayers" data-bs-parent="#dashboardAccordion">
            <div class="accordion-body">

              <div class="row">

                <div class="col-lg-6 col-md-6 mb-4 d-flex justify-content-center">
                  <div class="bg-white rounded shadow p-5 h-100 animate__animated animate__fadeInUp" style="width: 550px; height: 550px; max-width: 100%;">
                    {{ chart_pie|safe }}
                  </div>
                </div>

                <div class="col-lg-6 col-md-6 mb-4 d-flex justify-content-center">
                  <div class="bg-white rounded shadow p-5 h-100 animate__animated animate__fadeInUp" style="width: 550px; height: 550px; max-width: 100%;">
                    {{ chart_hist|safe }}
                  </div>
                </div>

                <div class="col-lg-6 col-md-6 mb-4 d-flex justify-content-center">
                  <div class="bg-white rounded shadow p-5 h-100 animate__animated animate__fadeInUp" style="width: 550px; height: 550px; max-width: 100%;">
                    {{ chart_sessions|safe }}
                  </div>
                </div>

                <div class="col-lg-6 col-md-6 mb-4 d-flex justify-content-center">
                  <div class="bg-white rounded shadow p-5 h-100 animate__animated animate__fadeInUp" style="width: 550px; height: 550px; max-width: 100%;">
                    {{ chart_eps|safe }}
                  </div>
                </div>

              </div>
            </div>
          </div>
        </div>
        <!-- Guardian statistics section -->
        <div class="accordion-item">
          <h2 class="accordion-header" id="headingGuardians">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseGuardians" aria-expanded="false" aria-controls="collapseGuardians">
              Estadísticas de acudientes
            </button>
          </h2>
          <div id="collapseGuardians" class="accordion-collapse collapse" aria-labelledby="headingGuardians" data-bs-parent="#dashboardAccordion">
            <div class="accordion-body">
              <!-- Guardian charts go here -->
              <div class="text-muted">No hay gráficos de acudientes aún.</div>
            </div>
          </div>
        </div>
        <!-- Payments section -->
        <div class="accordion-item">
          <h2 class="accordion-header" id="headingPayments">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapsePayments" aria-expanded="false" aria-controls="collapsePayments">
              Estadísticas de pagos
            </button>
          </h2>
          <div id="collapsePayments" class="accordion-collapse collapse" aria-labelledby="headingPayments" data-bs-parent="#dashboardAccordion">
            <div class="accordion-body">
              <!-- Payments charts go here -->
              <div class="text-muted">No hay gráficos de pagos aún.</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}

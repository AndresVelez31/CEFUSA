{% load static %}

<!doctype html>
<html lang="en">
    <head>
        <title> {% block title %} {% endblock %} </title>

        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.2.1 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
        crossorigin="anonymous">

        <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
        crossorigin="anonymous">
    </script>

    </head>

    <nav class="navbar bg-body-tertiary">
    <div class="container-fluid d-flex align-items-center">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/">
            <img src="{% static 'img/LogoCefusa.png' %}" alt="Logo CEFUSA" style="height:80px; width:auto; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1); background:#fff; padding:4px;" class="me-2">
            <span style="font-weight:bold; font-size:1.7rem; letter-spacing:2px; color:#2c3e50;">CEFUSA</span>
        </a>
    </div>
    </nav>

    <br>

    <div class="container">
        <div class="row">
            <div class="col">
                {% block content %} {% endblock %}
            </div>
        </div>
    </div>

    <body>
        <main></main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Libraries -->
    </body>
</html>
